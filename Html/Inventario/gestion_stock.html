<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Stock - Librería Siamés</title>
        <link rel="icon" href="../../imagenes/logo.png">

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/sesion.js"></script>

        <script src="../../Js/stock.js"></script>

        <script src="../../Js/Inventario/gestion_stock.js"></script>
    </head>
    <body class="bg-light">

        <nav
            class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-primary" href="../index.html">
                    <i class="fa-solid fa-book me-2"></i><strong>Librería
                        Siamés</strong>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <a href="../mi_cuenta.html"
                        class="btn btn-outline-secondary btn-sm"><i
                            class="fa-solid fa-arrow-left me-1"></i>Volver al
                        Panel</a>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <!-- Alerta de éxito al guardar stock -->
                    <div id="alertaInventario"
                        class="alert d-none text-center fw-bold shadow-sm"
                        role="alert"></div>

                    <div class="card shadow-sm border-0">
                        <div
                            class="card-header bg-white border-bottom pb-3 pt-4 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                            <h4 class="fw-bold m-0"><i
                                    class="fa-solid fa-boxes-stacked text-secondary me-2"></i>Gestión
                                de Inventario</h4>

                            <!-- Barra de Búsqueda -->
                            <div class="input-group" style="max-width: 350px;">
                                <span
                                    class="input-group-text bg-white text-muted border-end-0"><i
                                        class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" id="buscadorStock"
                                    class="form-control border-start-0 ps-0"
                                    placeholder="Buscar libro o juego...">
                            </div>
                        </div>

                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table
                                    class="table table-hover align-middle mb-0">
                                    <thead class="table-light text-muted">
                                        <tr>
                                            <th class="ps-4 py-3">Nombre del
                                                Producto</th>
                                            <th class="py-3 text-center">Stock
                                                Actual</th>
                                            <th
                                                class="py-3 text-center">Modificar
                                                Cantidad</th>
                                            <th
                                                class="py-3 text-center pe-4">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaStock">
                                        
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
