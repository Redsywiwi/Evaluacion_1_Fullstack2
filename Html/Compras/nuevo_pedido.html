<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nuevo Pedido a Proveedor - Librería Siamés</title>
        <link rel="icon" href="../../imagenes/logo.png">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/sesion.js"></script>
        <script src="../../Js/Compras/nuevo_pedido.js"></script>
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary" href="../index.html">
                <i class="fa-solid fa-book me-2"></i><strong>Librería Siamés</strong>
            </a>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <a href="../Vendedor/consultar_stock.html" class="btn btn-info text-white btn-sm fw-semibold">
                    <i class="fa-solid fa-boxes-stacked me-1"></i>Consultar Stock
                </a>
                
                <a href="nuevo_pedido.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i>Crear Pedido</a>
                <a href="../mi_cuenta.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>Volver al Panel</a>
            </div>
        </div>
    </nav>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 p-4">
                        <h4 class="fw-bold mb-4"><i
                                class="fa-solid fa-file-invoice text-primary me-2"></i>Generar
                            Orden de Compra</h4>

                        <form id="formNuevoPedido" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Proveedor
                                    / Editorial *</label>
                                <select class="form-select" id="selectProveedor"
                                    required>
                                    <option value selected disabled>Seleccione
                                        un proveedor...</option>
                                    <option
                                        value="Distribuidora del Libro">Distribuidora
                                        del Libro (Literatura y
                                        ficción)</option>
                                    <option value="Textos Académicos SA">Textos
                                        Académicos SA (Académico y
                                        universitario)</option>
                                    <option
                                        value="Importadora del Sur">Importadora
                                        del Sur (Libros importados)</option>
                                </select>
                                <div class="invalid-feedback">Debe seleccionar
                                    un proveedor.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Producto a
                                    solicitar *</label>
                                <input type="text" class="form-control"
                                    id="inputProducto"
                                    placeholder="Ej. Catan: El juego" required>
                                <div class="invalid-feedback">Especifique el
                                    nombre del producto.</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Cantidad
                                    (Unidades) *</label>
                                <input type="number" class="form-control"
                                    id="inputCantidad" min="1" value="1"
                                    required>
                                <div class="invalid-feedback">Ingrese una
                                    cantidad válida.</div>
                            </div>

                            <button type="submit"
                                class="btn btn-primary w-100 py-2 fw-bold"><i
                                    class="fa-solid fa-paper-plane me-2"></i>Emitir
                                Orden</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
