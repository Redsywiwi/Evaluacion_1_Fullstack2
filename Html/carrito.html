<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Carrito - Librería Siamés</title>
        <link rel="icon" href="../imagenes/logo.png">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../Js/sesion.js"></script>
        <script src="../Js/carrito.js"></script>
    </head>
    <body class="bg-light">

        <header>
            <div class="bg-dark text-white text-center py-2">
                <p class="mb-0 d-inline-flex align-items-center gap-2">
                    <i class="fa-solid fa-heart"></i>
                    ¡Nueva colección Chilena!
                    <img src="../imagenes/chile.png"
                        style="height: 1em; width: auto;"
                        class="align-baseline">
                </p>
            </div>
        </header>

        <nav
            class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-primary" href="index.html">
                    <i class="fa-solid fa-book me-2"></i><strong>Librería
                        Siamés</strong>
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link"
                                href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="categorias.html">Categorías</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link"
                                href="blog.html">Blog</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <a href="carrito.html"
                            class="text-dark text-decoration-none position-relative">
                            <i class="fa-solid fa-cart-shopping fs-5"></i>
                        </a>
                        <a href="login_registro.html" id="btnAuth"
                            class="btn btn-outline-primary btn-sm">Iniciar
                            Sesión</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <h2 class="fw-bold mb-4"><i
                    class="fa-solid fa-cart-shopping me-2 text-primary"></i>Tu
                Carrito</h2>

            <div class="row g-4">
                <!-- Lista de productos -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4" id="contenedorCarrito">

                            <div class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm"
                                    role="status"></div> Cargando carrito...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumen de Compra -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 sticky-top"
                        style="top: 100px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold border-bottom pb-3 mb-3">Resumen
                                de la Orden</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal</span>
                                <span id="resumenSubtotal"
                                    class="fw-semibold">$0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <h5 class="fw-bold mb-0">Total</h5>
                                <h5 class="fw-bold text-primary mb-0"
                                    id="resumenTotal">$0</h5>
                            </div>
                            <button class="btn btn-primary w-100 py-2 fw-bold"
                                id="btnPagar">Ir a Pagar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
