<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Usuarios - Librería Siamés</title>
        <link rel="icon" href="../../imagenes/logo.png">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/sesion.js"></script>
        <script src="../../Js/Admin/gestion_usuarios.js"></script>
    </head>
    <body class="bg-light">

        <nav
            class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-primary" href="../index.html">
                    <i class="fa-solid fa-book me-2"></i><strong>Librería
                        Siamés</strong>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <a href="../mi_cuenta.html"
                        class="btn btn-outline-secondary btn-sm"><i
                            class="fa-solid fa-arrow-left me-1"></i>Volver al
                        Panel</a>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom pb-3 pt-4 px-4">
                    <h4 class="fw-bold m-0"><i
                            class="fa-solid fa-users-gear text-warning me-2"></i>Control
                        de Usuarios</h4>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th class="ps-4 py-3">ID</th>
                                    <th class="py-3">Nombres</th>
                                    <th class="py-3">Correo</th>
                                    <th class="py-3 text-center">Rol</th>
                                    <th
                                        class="py-3 text-center pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuarios">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Editar Usuario -->
        <div class="modal fade" id="modalEditarUsuario" tabindex="-1"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-warning border-0 pb-3">
                        <h5 class="modal-title fw-bold text-dark"><i
                                class="fa-solid fa-user-pen me-2"></i>Editar
                            Usuario</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form id="formEditarUsuario">
                            <input type="hidden" id="editCorreoOriginal">
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label
                                        class="fw-semibold small">Nombres</label>
                                    <input type="text" id="editNombres"
                                        class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label
                                        class="fw-semibold small">Apellidos</label>
                                    <input type="text" id="editApellidos"
                                        class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="fw-semibold small">Correo
                                    Electrónico</label>
                                <input type="email" id="editCorreo"
                                    class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="fw-semibold small">Asignar
                                    Rol</label>
                                <select id="editRol" class="form-select">
                                    <option value="usuario">Cliente
                                        (Usuario)</option>
                                    <option value="vendedor">Vendedor</option>
                                    <option value="inventario">Encargado de
                                        Inventario</option>
                                    <option value="compras">Encargado de
                                        Compras</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label
                                    class="fw-semibold small">Dirección</label>
                                <input type="text" id="editDireccion"
                                    class="form-control">
                            </div>
                            <button type="submit"
                                class="btn btn-warning w-100 fw-bold">Guardar
                                Cambios</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
