<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard Admin - Librería Siamés</title>
        <link rel="icon" href="../../imagenes/logo.png">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../../Js/sesion.js"></script>
        <script src="../../Js/Admin/dashboard.js"></script>
    </head>
    <body class="bg-light">

        <nav
            class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand text-primary" href="../index.html">
                    <i class="fa-solid fa-book me-2"></i><strong>Librería
                        Siamés</strong>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <a href="../mi_cuenta.html"
                        class="btn btn-outline-secondary btn-sm"><i
                            class="fa-solid fa-arrow-left me-1"></i>Volver al
                        Panel</a>
                </div>
            </div>
        </nav>

        <div class="container py-5">
            <h3 class="fw-bold mb-4"><i
                    class="fa-solid fa-chart-line text-warning me-2"></i>Reportes
                de Ventas y Rentabilidad</h3>

            <!-- Tarjetas de Resumen -->
            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div
                        class="card shadow-sm border-0 bg-primary text-white h-100">
                        <div class="card-body">
                            <h6 class="text-uppercase fw-bold opacity-75">Ventas
                                del Mes</h6>
                            <h2 class="fw-bold mb-0">$1.245.000</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div
                        class="card shadow-sm border-0 bg-success text-white h-100">
                        <div class="card-body">
                            <h6
                                class="text-uppercase fw-bold opacity-75">Rentabilidad
                                Neta</h6>
                            <h2 class="fw-bold mb-0">$485.500</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div
                        class="card shadow-sm border-0 bg-info text-white h-100">
                        <div class="card-body">
                            <h6
                                class="text-uppercase fw-bold opacity-75">Solicitudes
                                "Publica con Nosotros"</h6>
                            <h2 class="fw-bold mb-0"
                                id="contadorSolicitudes">Calculando...</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Graficos -->
            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white pb-0 border-0 pt-3">
                            <h6 class="fw-bold text-muted">Rentabilidad por
                                Título (Top 5)</h6>
                        </div>
                        <div class="card-body">
                            <canvas id="graficoProductos"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white pb-0 border-0 pt-3">
                            <h6 class="fw-bold text-muted">Ventas por
                                Categoría</h6>
                        </div>
                        <div class="card-body d-flex align-items-center">
                            <canvas id="graficoCategorias"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
